<!doctype html>
<html lang="en" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Poden+</title>
<meta name="description" content="A fast podcast player that finds and skips interludes, extras, ads and silence, with word-by-word transcripts.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poden+">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="modulepreload" href="js/app.js"><link rel="modulepreload" href="js/model.js"><link rel="modulepreload" href="js/player.js"><link rel="modulepreload" href="js/views.js"><link rel="modulepreload" href="js/analyzer.js"><link rel="modulepreload" href="js/ui.js"><link rel="modulepreload" href="js/transcript.js"><link rel="modulepreload" href="js/store.js"><link rel="modulepreload" href="js/icons.js">
<link rel="stylesheet" href="css/app.css">
<script>try{var s=JSON.parse(localStorage.getItem('p.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme==='gamer'||s.theme==='manga'?'mono':['classic','girly','mono','cover'].includes(s.theme)?s.theme:'classic';if(s.textScale)document.documentElement.style.setProperty('--scale',s.textScale)}catch(e){}</script>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="bar" class="glass hidden" role="region" aria-label="Player"></div>
<nav id="tabbar" class="glass" aria-label="Sections"></nav>
<section id="np" aria-label="Now Playing" aria-hidden="true"></section>
<section id="mini" class="hidden" aria-label="Mini player"></section>
<script src="js/textlib.js"></script>
<script src="js/detect-core.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
